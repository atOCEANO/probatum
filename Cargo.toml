[workspace]
resolver = "2"
members = [
    "crates/probatum-core",
    "crates/probatum-engine",
    "crates/probatum-py",
]

[workspace.package]
version = "1.3.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/atOCEANO/embeddable-market-simulation-library"

[workspace.dependencies]
pyo3 = "0.29"
numpy = "0.29"
rayon = "1"
libm = "0.2"
criterion = "0.5"
proptest = "1"

# The shipped wheel and the benches are release builds; the hot loop is deliberately
# split across crates, so cross-crate inlining is where the speed is. panic stays
# unwind (the default), which pyo3 requires.
[profile.release]
lto = "thin"
codegen-units = 1
