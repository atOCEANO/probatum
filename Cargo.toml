[workspace]
resolver = "2"
members = [
    "crates/probatum-core",
    "crates/probatum-engine",
    "crates/probatum-py",
]

[workspace.package]
version = "2.0.0-rc.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/atOCEANO/probatum"

[workspace.dependencies]
pyo3 = "0.29"
numpy = "0.29"
rayon = "1"
libm = "0.2"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
criterion = "0.5"
proptest = "1"

# The shipped wheel and the benches are release builds; the hot loop is deliberately
# split across crates, so cross-crate inlining is where the speed is. panic stays
# unwind (the default), which pyo3 requires.
[profile.release]
lto = "thin"
codegen-units = 1
