# Continuous integration: the same two loops used locally. The pure-Rust crates
# are tested, formatted, and linted; the one abi3 wheel is built on each platform a
# release ships one for, and imported and tested there on Python 3.13 and 3.14,
# installing from dev/constraints.txt as the Docker gate does, the Linux wheels in
# the gate's own stages. The slow tests and the browser, SB3, sdist and Miri checks
# run as the same Docker stages they are locally, and against the commit before,
# the changed Rust lines get mutation testing and the step loop an instruction
# count.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (test, fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13" # pyo3 builds probatum-py against an interpreter at the floor
      - uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo test --locked -p probatum-core -p probatum-engine
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  linux:
    name: wheel on Linux ${{ matrix.machine }}, ${{ matrix.stage }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # one platform failing must not hide another's result
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        stage: [test313, test314]
        include:
          - runner: ubuntu-latest
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --target ${{ matrix.stage }} .

  wheel:
    name: wheel on ${{ matrix.runner }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    defaults:
      run:
        shell: bash # Windows' own shell hands pip the wheel's glob unexpanded
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13" # the wheel is built at the floor, as a release builds it
      - uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88.0
      - run: pip install -c dev/constraints.txt maturin
      - run: maturin build --release --locked --out dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install -c dev/constraints.txt dist/*.whl \
            numpy gymnasium pandas pyarrow polars duckdb optuna cloudpickle scikit-learn pytest
      - run: python -c "import probatum; print(probatum.__version__)"
      - run: pytest -q tests

  docker-stages:
    name: slow tests, browser, SB3, sdist and Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --target test-slow .
      - run: docker build --target test-browser .
      - run: docker build --target test-sb3 .
      - run: docker build --target test-sdist .
      - run: docker build --target miri .

  # Both jobs below compare against the commit before. A new branch or a rewritten
  # history has none in reach, so the diff is empty and nothing is compared.
  mutants:
    name: mutants in the changed Rust lines
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88.0
      - run: cargo install --locked cargo-mutants --version 27.1.0
      - run: git diff "$BASE" HEAD > changes.diff || true > changes.diff
      - run: |
          cargo mutants --package probatum-core --package probatum-engine \
            --in-diff changes.diff --jobs 4

  instructions:
    name: step instruction counts against the commit before
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88.0
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo install --locked gungraun-runner --version 0.20.0
      - run: |
          if git checkout --quiet "$BASE" 2>/dev/null \
              && [ -f crates/probatum-engine/benches/step_instructions.rs ]; then
            cargo bench --locked -p probatum-engine --bench step_instructions \
              -- --save-baseline=base
          fi
          git checkout --quiet "$GITHUB_SHA"
      - run: |
          cargo bench --locked -p probatum-engine --bench step_instructions \
            -- --baseline=base --callgrind-limits='ir=10%'
