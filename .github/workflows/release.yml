# Release: build the abi3 wheels and the sdist, then publish them as a GitHub
# Release with the artifacts attached. One abi3 wheel per platform covers Python
# 3.13 and up, so the four below cover the common targets without a per-version
# matrix.
#
# A v* tag builds AND releases. A manual dispatch builds only, so the whole
# matrix can be dry-run before committing to a tag:
#   Actions -> release -> Run workflow

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # one platform failing must not cancel the others
      matrix:
        # each wheel built on the machine it is for, as CI builds and tests it, the two
        # Linux ones by the gate's own builder
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash # so a step of two commands stops at the first that fails, on Windows too
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: runner.os == 'Linux'
        run: docker build --target wheels --output dist .
      - if: runner.os != 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13" # pyo3 builds against an interpreter at the floor
      - if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88.0
      - if: runner.os != 'Linux'
        run: |
          pip install -c dev/constraints.txt maturin
          maturin build --release --locked --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.runner }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88.0
      - run: pip install -c dev/constraints.txt maturin
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: publish the release
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # a dispatch builds only, never releases
    permissions:
      contents: write # creating a release writes to the repo
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          # the change list is derived rather than written out here: the
          # hand-written one went out unchanged on eleven tags, still describing a
          # release three minor versions back. This repo commits straight to main,
          # so what lands is the compare link against the previous tag
          generate_release_notes: true
          body: |
            `probatum` is a bar-level crypto market simulator: a Rust core with a small
            Python surface. One engine drives a single backtest, a parameter search,
            and a batched reinforcement-learning rollout, so all three see the same
            fill model and the same costs.

            ## Install

            Wheels are attached below, one per platform, each covering Python 3.13 and
            up, and no compiler is needed. probatum is not on PyPI, so install the wheel
            for your machine by its URL:

            ```bash
            pip install "probatum @ <the wheel's URL, from the Assets below>"
            ```

            The optional extras go in brackets before the `@`: `"probatum[rl,search] @ <URL>"`.

            Building from source instead needs the [Rust toolchain](https://rustup.rs):

            ```bash
            pip install "git+https://github.com/atOCEANO/embeddable-market-simulation-library.git@${{ github.ref_name }}"
            ```

            ## Scope

            Bar-level and approximate by design. It does not model the order book
            (L2), latency, or queue position, and it places no live orders. At bar
            granularity the fill model cannot see the intrabar path, so it can be
            slightly more generous than a live book would be; the costs it charges
            are the real ones.
