[package]
name = "probatum-py"
description = "PyO3 bindings for the probatum bar-level market simulator, compiled to the probatum._probatum extension module."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_probatum"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["abi3-py313", "extension-module"] }
numpy = { workspace = true }
probatum-core = { path = "../probatum-core" }
probatum-engine = { path = "../probatum-engine" }
