[package]
name = "probatum-engine"
description = "Bar-level market simulation over probatum-core: the next-bar fill model, the step state machine, performance stats, and the parallel batch runner."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
probatum-core = { path = "../probatum-core" }
rayon = { workspace = true }
libm = { workspace = true }
rand_chacha = { workspace = true, features = ["serde"] }
serde = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
# exact, because the gungraun-runner binary that runs the bench must match it
gungraun = "=0.20.0"

[[bench]]
name = "step"
harness = false

[[bench]]
name = "step_instructions"
harness = false

[[bench]]
name = "sweep"
harness = false
