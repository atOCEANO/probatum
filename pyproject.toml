[build-system]
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "probatum"
description = "Embeddable market simulation library: a Rust-core crypto market simulator for reinforcement learning, backtests, and parameter search."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT AND Apache-2.0 AND BSD-2-Clause AND ISC"
license-files = [
    "LICENSE",
    "THIRD-PARTY-LICENSES",
    "python/probatum/_static/LICENSE-lightweight-charts",
    "python/probatum/_static/NOTICE-lightweight-charts",
    "python/probatum/_static/LICENSE-lucide",
]
authors = [{ name = "Dinis Martinho" }]
dynamic = ["version"]
dependencies = [
    "numpy>=2.2",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
rl = ["gymnasium>=1.2"]
search = ["optuna>=5.0", "cloudpickle>=2.0"]

[project.urls]
Repository = "https://github.com/atOCEANO/embeddable-market-simulation-library"

[tool.maturin]
manifest-path = "crates/probatum-py/Cargo.toml"
python-source = "python"
module-name = "probatum._probatum"
features = ["pyo3/extension-module"]
